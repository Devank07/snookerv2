<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#F2F3EE">
<script>(function(){ var t = null; try { t = localStorage.getItem('upbsa-theme'); } catch(e){} document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); })();</script>
<title>Live Draws & Results — UPBSA.TV</title>
<meta name="description" content="Live scores, draws, brackets and results from UPBSA.TV cue sports events">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="bracket-core.js?v=20261122b"></script>
<script src="yt-live.js?v=20261028f"></script>
<script src="share-card.js?v=20261122"></script>
<style>
/* ── theme tokens: light (default) and dark ── */
:root{--bg:#F2F3EE;--card:#FFFFFF;--card2:#FAFAF7;--sunk:#F2F3EE;--line:#E3E5DD;--line2:#D3D7CC;--text:#15201A;--dim:#3E4A43;--faint:#5E6B63;
  --acc:#0B6B3F;--acc-soft:#E8F2EC;--win:#0B6B3F;--win-tx:#FFFFFF;--gold:#8A6100;--gold-fill:#FFC531;--gold-soft:#FFF3D6;
  --live:#D7263D;--live-soft:#FDECEE;--live-tx:#A3172A;--blue:#1F6FD1;--blue-soft:#E3EEFB;--ink:#15201A;--ink2:#22302A;--ink-tx:#FFFFFF;--ink-dim:#B8C2BC;
  --tab-on:#15201A;--tab-on-tx:#FFFFFF;--pos:#0B6B3F;--neg:#C42B2B;--shadow:0 1px 2px rgba(21,32,26,.06),0 6px 18px rgba(21,32,26,.05);--top:rgba(255,255,255,.92);
  --green:var(--acc);color-scheme:light;}
:root[data-theme="dark"]{--bg:#0A0D10;--card:#12161B;--card2:#161B22;--sunk:#0D1014;--line:#232A31;--line2:#2E3740;--text:#E9EEF2;--dim:#AEB8C1;--faint:#808B96;
  --acc:#FFC531;--acc-soft:rgba(255,197,49,.12);--win:#FFC531;--win-tx:#0A0C0F;--gold:#FFC531;--gold-fill:#FFC531;--gold-soft:rgba(255,197,49,.12);
  --live:#FF4D5E;--live-soft:rgba(255,77,94,.13);--live-tx:#FF8591;--blue:#5FB8FF;--blue-soft:rgba(95,184,255,.15);--ink:#05070A;--ink2:#141920;--ink-tx:#E9EEF2;--ink-dim:#8E99A4;
  --tab-on:#FFC531;--tab-on-tx:#0A0C0F;--pos:#5BD68A;--neg:#FF8591;--shadow:none;--top:rgba(10,13,16,.9);color-scheme:dark;}
/* older match boxes (groups / leagues) follow the theme too */
:root{--bk-card:var(--card);--bk-gold:var(--gold);--bk-dim:var(--faint);--bk-line:var(--line);--bk-line2:var(--line);--bk-wire:var(--line2);--bk-text:var(--text);}
.bk-rh,.bk-meta{font-family:'Inter',sans-serif!important;letter-spacing:.5px!important;}
.bk-meta{background:var(--sunk)!important;}.bk-meta .lv{color:var(--live-tx)!important;}
.bk-m.live{border-color:var(--live)!important;box-shadow:0 0 0 3px var(--live-soft)!important;animation:none!important;}
.bk-p{border-top-color:var(--line)!important;}.bk-p .n{font:600 13.5px 'Inter',sans-serif!important;}.bk-p .n small{font-family:'Inter',sans-serif!important;}
.bk-p .s{font:700 16px 'Space Grotesk',sans-serif!important;}
.bk-p.w{background:var(--acc-soft)!important;}.bk-p.w .n,.bk-p.w .s{color:var(--acc)!important;font-weight:800!important;}
.bk-p.hl{background:var(--blue-soft)!important;}.bk-p.hl .n{color:var(--blue)!important;}
.bk-champ{background:var(--gold-soft)!important;border-color:var(--gold-fill)!important;}.bk-champ b{font:700 22px 'Space Grotesk',sans-serif!important;color:var(--text)!important;}
*{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
:root[data-theme="dark"] body{background:radial-gradient(1100px 480px at 88% -8%,rgba(255,197,49,.09),transparent 60%) no-repeat,var(--bg);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
.cut{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));}
@keyframes blink{50%{opacity:.25}}
/* top */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:0 20px;height:62px;background:var(--top);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.top:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--gold-fill) 0 120px,transparent 120px);}
.logo{display:flex;align-items:center;gap:10px;font:700 20px 'Space Grotesk',sans-serif;letter-spacing:-.3px;}
.logo img{width:36px;height:36px;border-radius:10px;object-fit:cover;border:1px solid var(--line2);}
.logo i{font-style:normal;color:var(--live);}
.nav{display:flex;gap:4px;margin-left:10px;}
.nav a{height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 14px;border-radius:999px;font:600 14px 'Inter',sans-serif;color:var(--dim);}
.nav a:hover{color:var(--text);background:var(--sunk);}
.nav a.on{color:var(--acc);background:var(--acc-soft);font-weight:700;}
.nav .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--live);color:#fff;font:800 11.5px 'Inter',sans-serif;display:inline-flex;align-items:center;justify-content:center;}
.sp{flex:1;}
.clock{font:600 18px 'Space Grotesk',sans-serif;color:var(--faint);font-variant-numeric:tabular-nums;}
.thm{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.thm:hover{border-color:var(--acc);}
.thm svg{width:18px;height:18px;}
.thm .sun{display:none;}:root[data-theme="dark"] .thm .sun{display:block;}:root[data-theme="dark"] .thm .moon{display:none;}
.wrap{max-width:1440px;margin:0 auto;padding:24px 20px 64px;}
.h1{font:700 clamp(30px,4vw,46px)/1.02 'Space Grotesk',sans-serif;letter-spacing:-1.2px;}
.h1 em{font-style:normal;color:var(--live);}
.sub{color:var(--dim);font-size:14px;margin-top:6px;}
.sec{display:flex;align-items:center;gap:10px;margin:30px 0 14px;font:700 21px 'Space Grotesk',sans-serif;letter-spacing:-.3px;color:var(--text);}
.sec:before{content:'';width:5px;height:22px;background:var(--gold-fill);transform:skewX(-14deg);flex:none;}
.sec:after{content:'';flex:1;height:1px;background:var(--line);}
.sec b{font:700 14px 'Inter',sans-serif;color:var(--faint);}
.empty{padding:34px 18px;text-align:center;color:var(--dim);border:1px dashed var(--line2);border-radius:16px;background:var(--card2);}
/* live cards */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}
.lc{position:relative;display:block;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow);transition:border-color .2s,transform .2s;}
.lc.live:before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--live);}
.lc:hover{border-color:var(--line2);transform:translateY(-2px);}
.lc.live{border-color:var(--live);box-shadow:0 0 0 3px var(--live-soft),var(--shadow);}
.lc-h{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--card2);border-bottom:1px solid var(--line);font:700 12px 'Inter',sans-serif;color:var(--dim);}
.lc-h .lv{padding:3px 8px;border-radius:5px;background:var(--live);color:#fff;font:800 11px 'Inter',sans-serif;letter-spacing:1px;text-transform:uppercase;}
.lc-h .lv:before{content:'● ';animation:blink 1.2s steps(2) infinite;}
.lc-h .sp{flex:1;}
.lc-ev{padding:10px 16px 0;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lc-b{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:12px 16px 18px;}
.lc-p{min-width:0;}.lc-p.r{text-align:right;}
.lc-n{font:700 19px/1.15 'Inter',sans-serif;letter-spacing:-.2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.lc-n .at{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold-fill);box-shadow:0 0 0 3px var(--gold-soft);margin:0 7px 3px;vertical-align:middle;}
.lc-st{font:700 10.5px 'Inter',sans-serif;color:var(--faint);letter-spacing:.8px;margin-top:3px;}
.lc-pts{font:700 30px/1 'Space Grotesk',sans-serif;margin-top:8px;font-variant-numeric:tabular-nums;}
.lc-pts small{font:700 11px 'Inter',sans-serif;color:var(--gold);margin:0 6px;vertical-align:middle;}
.lc-fr{text-align:center;padding:8px 14px;background:var(--ink);color:var(--ink-tx);font:700 34px/1 'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));}
.lc-fr small{display:block;font:700 9.5px 'Inter',sans-serif;letter-spacing:1.5px;color:var(--ink-dim);margin-top:4px;}
/* events */
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;}
.ec{position:relative;display:block;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .2s,transform .2s;overflow:hidden;}
.ec:after{content:'';position:absolute;right:-30px;top:0;width:60px;height:6px;background:var(--gold-fill);transform:skewX(-30deg);}
.ec:hover{border-color:var(--acc);transform:translateY(-2px);}
.ec-t{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.badge{padding:3px 9px;border-radius:999px;font:700 11px 'Inter',sans-serif;letter-spacing:.3px;background:var(--sunk);color:var(--dim);}
.badge.live{background:var(--live);color:#fff;}.badge.done{background:var(--blue-soft);color:var(--blue);}.badge.gold{background:var(--gold-soft);color:var(--gold);}
.ec-n{font:700 23px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.5px;}
.ec-m{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.55;}
.ec-c{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;}
.ec-c span{padding:4px 10px;border-radius:999px;background:var(--sunk);font:600 12px 'Inter',sans-serif;color:var(--dim);}
.ec-ch{margin-top:12px;font:600 13px 'Inter',sans-serif;color:var(--gold);}
/* event page */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font:600 13px 'Inter',sans-serif;margin-bottom:14px;}
.back:hover{color:var(--text);}
.ehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;}
.tab{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--dim);font:600 14px 'Inter',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
.tab.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:700;}
.tab .dotl,.vtab .dotl{width:7px;height:7px;border-radius:50%;background:var(--live);animation:blink 1.2s steps(2) infinite;}
.stabs{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap;}
.stab{height:34px;display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);font:600 13px 'Inter',sans-serif;cursor:pointer;background:var(--card);}
.stab.on{background:var(--tab-on);border-color:var(--tab-on);color:var(--tab-on-tx);font-weight:700;}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0 8px;}
.find{height:40px;min-width:220px;flex:0 1 320px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--text);padding:0 14px;font:500 14px 'Inter',sans-serif;}
.find::placeholder{color:var(--faint);}
.find:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft);}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--faint);}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.champ{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;margin-top:16px;padding:16px 20px;background:var(--gold-soft);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));}
.champ:after{content:'';position:absolute;right:-40px;top:0;bottom:0;width:120px;background:var(--gold-fill);transform:skewX(-20deg);opacity:.85;}
.champ .tr{font-size:34px;position:relative;}.champ b{display:block;font:700 28px/1.05 'Space Grotesk',sans-serif;letter-spacing:-.5px;color:var(--text);}.champ span{font:700 11.5px 'Inter',sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);}
/* groups */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;}
.gc{border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow);}
.gc-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card2);border-bottom:1px solid var(--line);}
.gc-h b{font:700 17px 'Space Grotesk',sans-serif;}
.gc-h span{font:600 12px 'Inter',sans-serif;color:var(--faint);}
table.st{width:100%;border-collapse:collapse;font-size:14px;}
table.st th{padding:8px 6px;font:700 10.5px 'Inter',sans-serif;letter-spacing:1px;color:var(--faint);text-align:center;text-transform:uppercase;}
table.st th:nth-child(2){text-align:left;}
table.st td{padding:9px 6px;border-top:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums;}
table.st td:nth-child(1){width:34px;color:var(--faint);font:700 15px 'Space Grotesk',sans-serif;}
table.st td:nth-child(2){text-align:left;font:600 14.5px 'Inter',sans-serif;}
table.st td:nth-child(2) small{display:block;font:600 11px 'Inter',sans-serif;color:var(--faint);}
table.st tr.q td:nth-child(1){color:var(--acc);}
table.st tr.q td:nth-child(2){box-shadow:inset 3px 0 0 var(--acc);}
table.st td.pts{font:700 17px 'Space Grotesk',sans-serif;color:var(--acc);}
table.st tr.hl td{background:var(--blue-soft);}
.gm{padding:6px 10px 10px;display:flex;flex-direction:column;gap:6px;}
.mr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--sunk);font:600 13.5px 'Inter',sans-serif;}
.mr .a{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.mr .b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mr .w{color:var(--acc);font-weight:800;}.mr .l{opacity:.55;}
.mr .sc{min-width:64px;text-align:center;font:700 16px 'Space Grotesk',sans-serif;}
.mr .sc small{display:block;font:600 9.5px 'Inter',sans-serif;color:var(--faint);}
.mr.live{background:var(--live-soft);box-shadow:inset 0 0 0 1px var(--live);}
.mr.live .sc small{color:var(--live-tx);}
.mr.hl{box-shadow:inset 0 0 0 2px var(--blue);}
/* results */
.rlist{display:flex;flex-direction:column;gap:8px;}
.rr{display:grid;grid-template-columns:120px 1fr auto 1fr 190px;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font:600 15px 'Inter',sans-serif;box-shadow:var(--shadow);}
.rr:hover{border-color:var(--line2);}
.rr .t{font:500 12px 'Inter',sans-serif;color:var(--faint);}
.rr .a{text-align:right;}.rr .w{color:var(--acc);font-weight:800;}.rr .l{opacity:.55;}
.rr .sc{font:700 20px 'Space Grotesk',sans-serif;min-width:70px;text-align:center;font-variant-numeric:tabular-nums;}
.rr .e{font:500 12px 'Inter',sans-serif;color:var(--faint);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bk-empty{padding:24px;text-align:center;color:var(--dim);}
/* YouTube */
.ytb{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;background:#E3002B;color:#fff;font:700 13.5px 'Inter',sans-serif;}
.ytb:hover{background:#FF1A47;}
.ytb.live:before{content:'';width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s steps(2) infinite;}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start;}
.player{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.25);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.wlist{display:flex;flex-direction:column;gap:8px;}
.wl-h{font:700 16px 'Space Grotesk',sans-serif;display:flex;align-items:center;gap:8px;}
.wl-h:before{content:'';width:8px;height:8px;border-radius:50%;background:#E3002B;animation:blink 1.2s steps(2) infinite;}
.wi{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;}
.wi:hover{border-color:#E3002B;}
.wi.on{border-color:#E3002B;background:var(--live-soft);}
.wi img,.wi .ph{width:96px;height:54px;border-radius:8px;object-fit:cover;flex:none;background:var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px;}
.wi b{display:block;font:700 14px/1.2 'Inter',sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.wi span{font-size:12px;color:var(--faint);}
.wl-sub{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:12px;background:#E3002B;color:#fff;font:700 14px 'Inter',sans-serif;margin-top:4px;}
.ytcta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 20px;border-radius:18px;background:var(--ink);color:var(--ink-tx);margin-bottom:6px;}
.ytcta b{display:block;font:700 20px 'Space Grotesk',sans-serif;letter-spacing:-.3px;}
.ytcta span{color:var(--ink-dim);font-size:13px;}
.ytcta .sp{flex:1;}
.watchbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:#E3002B;color:#fff;font:700 12px 'Inter',sans-serif;cursor:pointer;}
.ytbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding:10px 14px;border-radius:14px;background:var(--ink);color:var(--ink-tx);font:700 13px 'Inter',sans-serif;}
.ytbar a{color:#fff;padding:6px 12px;border-radius:999px;background:#E3002B;font-size:12.5px;}
.mr-yt{grid-column:1/-1;justify-self:center;margin-top:4px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:#E3002B;color:#fff;font:700 12px 'Inter',sans-serif;}
.bk-yt{display:inline-flex;align-items:center;gap:4px;height:16px;padding:0 7px;border-radius:999px;background:#E3002B;color:#fff!important;font:800 9.5px 'Inter',sans-serif;text-decoration:none;}
.lc-yt{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;background:#E3002B;color:#fff;font:700 14px 'Inter',sans-serif;cursor:pointer;}
.lc-yt:hover{background:#FF1A47;}
/* ── event page ── */
.ml.compact .mi{grid-template-columns:62px minmax(0,1fr) 52px minmax(0,1fr) 34px;}
.ml.compact .mi .tb,.ml.compact .mi .rd,.ml.compact .mi small{display:none;}
.ev-hero{position:relative;padding:30px 32px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));}
.ev-hero:before{content:'';position:absolute;right:-70px;top:0;bottom:0;width:230px;background:var(--gold-fill);transform:skewX(-18deg);}
.ev-hero:after{content:'';position:absolute;right:150px;top:0;bottom:0;width:34px;background:var(--gold-fill);transform:skewX(-18deg);opacity:.35;}
.ev-hero > *{position:relative;z-index:1;max-width:calc(100% - 210px);}
.ev-sub{display:inline-flex;padding:5px 11px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font:700 11.5px 'Inter',sans-serif;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;}
.ev-hero .h1{font-size:clamp(30px,4.2vw,52px);}
.ev-facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.ev-facts span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;background:var(--sunk);font:600 13px 'Inter',sans-serif;color:var(--dim);}
.ev-facts span b{color:var(--text);font-weight:700;}
.vtabs{display:flex;gap:4px;margin-top:18px;padding:5px;border-radius:14px;background:var(--card);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;}
.vtabs::-webkit-scrollbar{display:none;}
.vtab{flex:none;display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:10px;color:var(--dim);font:600 14px 'Inter',sans-serif;}
.vtab:hover{color:var(--text);background:var(--sunk);}
.vtab.on{background:var(--tab-on);color:var(--tab-on-tx);font-weight:700;}
.vtab small{font:700 11px 'Inter',sans-serif;opacity:.6;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--dim);font:600 13px 'Inter',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}

.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:700;}
.ov-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start;}
.rstrip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;}
.rs{flex:none;width:178px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:block;box-shadow:var(--shadow);}
.rs:hover{border-color:var(--line2);}
.rs b{display:block;font:700 15.5px 'Space Grotesk',sans-serif;letter-spacing:-.2px;}
.rs span{display:block;font:500 11.5px 'Inter',sans-serif;color:var(--faint);margin-top:2px;}
.rs .bar{height:6px;border-radius:3px;background:var(--sunk);margin-top:12px;overflow:hidden;}
.rs .bar i{display:block;height:100%;background:var(--acc);border-radius:3px;}
.rs .st{margin-top:8px;font:700 11.5px 'Inter',sans-serif;color:var(--faint);}
.rs.live{border-color:var(--live);}.rs.live .st{color:var(--live-tx);}.rs.live .bar i{background:var(--live);}.rs.done .st{color:var(--acc);}.rs.next .st{color:var(--gold);}
.rs.next{box-shadow:inset 0 3px 0 var(--gold-fill),var(--shadow);}
.ml{display:flex;flex-direction:column;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);}
.mlh{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card2);font:700 13px 'Inter',sans-serif;color:var(--dim);border-top:1px solid var(--line);}
.mlh:first-child{border-top:0;}.mlh b{color:var(--text);}.mlh .sp{flex:1;}.mlh small{font:500 11.5px 'Inter',sans-serif;color:var(--faint);}
.mi{display:grid;grid-template-columns:86px 46px minmax(0,1fr) 70px minmax(0,1fr) 92px 34px;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line);font:600 14.5px 'Inter',sans-serif;}
.mi:hover{background:var(--card2);}
.mi .tm{font:700 13px 'Inter',sans-serif;color:var(--text);}.mi .tm small{display:block;font:500 11px 'Inter',sans-serif;color:var(--faint);}
.mi .tb{font:700 11.5px 'Inter',sans-serif;color:var(--dim);text-align:center;padding:4px 0;border-radius:7px;background:var(--sunk);}
.mi .a{text-align:right;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.mi .b{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mi .a small,.mi .b small{font:700 10px 'Inter',sans-serif;color:var(--faint);margin:0 6px;letter-spacing:.4px;}
.mi .w{color:var(--text);font-weight:800;}.mi .l{color:var(--faint);}.mi .t{color:var(--faint);font-style:italic;font-weight:500;}
.mi .sc{justify-self:center;min-width:60px;padding:5px 8px;border-radius:8px;text-align:center;background:var(--sunk);font:700 17px/1 'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;}
.mi .sc.v{background:none;font:600 12px 'Inter',sans-serif;color:var(--faint);}
.mi .rd{text-align:right;font:600 11.5px 'Inter',sans-serif;color:var(--faint);}
.mi.live{background:var(--live-soft);box-shadow:inset 4px 0 0 var(--live);}.mi.live .sc{background:var(--live);color:#fff;}
.mi .sc .pts{display:block!important;margin:4px 0 0;font:600 10px 'Inter',sans-serif;opacity:.85;white-space:nowrap;}
.mi.live .tm{color:var(--live-tx);}
.mi .yt{grid-column:1/-1;justify-self:center;}
.mi.hl{box-shadow:inset 4px 0 0 var(--blue);background:var(--blue-soft);}
.soon{font:600 11px 'Inter',sans-serif;color:var(--gold);}
.shc{display:flex;justify-content:flex-end;}.mi .shb{width:32px;height:32px;font-size:14px;}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.pc{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;box-shadow:var(--shadow);}
.pc:hover{border-color:var(--line2);}
.pc .av{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font:700 16px 'Space Grotesk',sans-serif;background:var(--sunk);color:var(--faint);}
.pc.in .av{background:var(--acc-soft);color:var(--acc);}.pc.ch .av{background:var(--gold-fill);color:#15201A;}
.pc .nm{font:700 16px/1.15 'Inter',sans-serif;}
.pc .nm small{font:700 10.5px 'Inter',sans-serif;color:var(--faint);margin-left:6px;letter-spacing:.4px;}
.pc .ds{font:500 12.5px/1.4 'Inter',sans-serif;color:var(--dim);margin-top:3px;}
.pc .ds b{color:var(--text);font-weight:700;}
.pc.out{opacity:.62;}
.pc .tag{white-space:nowrap;margin-left:auto;align-self:flex-start;padding:2px 8px;border-radius:999px;font:700 10.5px 'Inter',sans-serif;background:var(--gold-soft);color:var(--gold);}
/* stats */
.stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:18px;}
.stt{padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);}
.stt b{display:block;font:700 36px/1 'Space Grotesk',sans-serif;letter-spacing:-1px;font-variant-numeric:tabular-nums;}.stt b i{font-style:normal;font-size:20px;color:var(--faint);}
.stt span{display:block;margin-top:8px;font:600 13px 'Inter',sans-serif;color:var(--dim);}
.stt small{display:block;margin-top:3px;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stt.gold{background:var(--gold-soft);border-color:var(--gold-fill);}.stt.gold b{color:var(--gold);}
.brr{display:grid;grid-template-columns:30px 60px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);}
.brr:first-child{border-top:0;}.brr.live{background:var(--live-soft);}
.brr .rk{font:700 12px Inter,sans-serif;color:var(--faint);text-align:center;}
.brr .bv{font:700 24px/1 'Space Grotesk',sans-serif;color:var(--gold);text-align:center;}
.brr .bn{font:700 15px 'Inter',sans-serif;min-width:0;}
.brr .bn small{display:block;font:500 11.5px Inter,sans-serif;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dst{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);}
.dr{display:grid;grid-template-columns:70px minmax(0,1fr) 96px;align-items:center;gap:10px;font:600 13px Inter,sans-serif;}
.dr .dn{font:700 13px 'Inter',sans-serif;letter-spacing:.5px;}
.dr .db{position:relative;height:10px;border-radius:5px;background:var(--sunk);}
.dr .db i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--line2);}.dr .db i.in{background:var(--acc);}
.dr .dc{text-align:right;}.dr .dc small{color:var(--faint);font-weight:500;}
.pst-w{overflow-x:auto;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);}
table.pst{width:100%;border-collapse:collapse;background:var(--card);font-size:14px;min-width:640px;}
table.pst th{padding:11px 8px;font:700 10.5px 'Inter',sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--faint);text-align:center;cursor:pointer;white-space:nowrap;background:var(--card2);}
table.pst th.on{color:var(--acc);}table.pst th:nth-child(2){text-align:left;}
table.pst td{padding:10px 8px;border-top:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums;}
table.pst td:first-child{color:var(--faint);font-size:12px;width:34px;}
table.pst td.nm{text-align:left;font:700 14.5px 'Inter',sans-serif;}table.pst td.nm small{font:700 10px Inter,sans-serif;color:var(--faint);margin-left:6px;letter-spacing:.4px;}
table.pst td.w{font:700 17px 'Space Grotesk',sans-serif;color:var(--acc);}table.pst td.hb{font-weight:800;}
table.pst tr.out td{opacity:.6;}table.pst tbody tr{cursor:pointer;}table.pst tbody tr:hover td{background:var(--card2);}
/* rankings */
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;margin-top:18px;}
.pd{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:18px 10px 16px;background:var(--card);border:1px solid var(--line);border-radius:18px;cursor:pointer;min-width:0;box-shadow:var(--shadow);}
.pd.e{visibility:hidden;}
.pd .md{font-size:30px;line-height:1;}.pd.p1 .md{font-size:42px;}
.pd b{font:700 18px/1.15 'Inter',sans-serif;margin-top:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pd small{font:700 10.5px Inter,sans-serif;color:var(--faint);min-height:13px;letter-spacing:.4px;}
.pd .pn{font:700 30px/1 'Space Grotesk',sans-serif;letter-spacing:-.5px;color:var(--dim);margin-top:8px;}
.pd em{font:500 11.5px Inter,sans-serif;font-style:normal;color:var(--faint);}
.pd.p1{padding-top:24px;padding-bottom:22px;background:var(--gold-soft);border-color:var(--gold-fill);}.pd.p1 .pn{color:var(--gold);font-size:40px;}.pd.p1 b{font-size:21px;}
.pd.p1:before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:var(--gold-fill);}
.pd.p2:before,.pd.p3:before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:#AEB7C2;}.pd.p3:before{background:#C98A4B;}
.hunt{display:flex;flex-wrap:wrap;gap:8px;}
.hc{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font:700 14px 'Inter',sans-serif;cursor:pointer;}
.hc small{font:600 11px Inter,sans-serif;color:var(--faint);}
.hc.live{border-color:var(--live);background:var(--live-soft);}.hc i{width:7px;height:7px;border-radius:50%;background:var(--live);animation:blink 1.2s steps(2) infinite;}
table.rkt{min-width:720px;}table.rkt th{cursor:default;}
table.rkt td.ps{width:60px;font:700 19px/1 'Space Grotesk',sans-serif;color:var(--dim);}
table.rkt tr.gs td{border-top-color:var(--line2);}
table.rkt tr.top1 td.ps{color:var(--gold);}table.rkt tr.top2 td.ps{color:#8D96A1;}table.rkt tr.top3 td.ps{color:#B87333;}
table.rkt td.fn{text-align:left;font:600 13px Inter,sans-serif;color:var(--dim);white-space:nowrap;}
table.rkt tr.in td.fn{color:var(--acc);}table.rkt .lv{color:var(--live);}
table.rkt td.w i{font-style:normal;font-size:14px;color:var(--faint);}
table.rkt td.pos{color:var(--pos);font-weight:700;}table.rkt td.neg{color:var(--neg);font-weight:700;}
table.rkt td.fm{white-space:nowrap;}table.rkt td.pt{font:700 18px 'Space Grotesk',sans-serif;color:var(--gold);}
table.rkt td.fm i{display:inline-flex;width:21px;height:21px;margin:0 1.5px;border-radius:6px;align-items:center;justify-content:center;font:800 10.5px Inter,sans-serif;font-style:normal;}
table.rkt td.fm i.w{background:var(--win);color:var(--win-tx);}table.rkt td.fm i.l{background:var(--sunk);color:var(--faint);border:1px solid var(--line2);}
table.rkt td.nm small.sd{color:var(--gold);background:var(--gold-soft);border-radius:4px;padding:1px 5px;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;}
table.rkt tr.out td{opacity:.75;}
/* players, profiles, hall of fame */
.prof .pf-top{display:flex;align-items:center;gap:18px;}
.pf-av{width:76px;height:76px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--gold-fill);font:700 30px 'Space Grotesk',sans-serif;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));}
.prof .ev-sub{margin-bottom:8px;}
.pf-act{margin-top:16px;}
.shbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border-radius:10px;border:0;background:var(--tab-on);color:var(--tab-on-tx);font:700 13.5px 'Inter',sans-serif;cursor:pointer;}
.shbtn:hover{opacity:.9;}
.shb{width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--line2);background:var(--card);color:var(--dim);font:700 15px 'Inter',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.shb:hover{color:var(--acc);border-color:var(--acc);}
.pf-next{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);}
.pf-next b{font:700 14px 'Inter',sans-serif;}.pf-next span{flex:1;min-width:200px;color:var(--dim);font-size:13.5px;}.pf-next a{color:var(--acc);font-weight:700;}
.pf-next.live{border-color:var(--live);background:var(--live-soft);}.pf-next.live b{color:var(--live-tx);}
.form{display:flex;gap:6px;flex-wrap:wrap;}
.fi{width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font:800 13px 'Inter',sans-serif;}
.fi.w{background:var(--win);color:var(--win-tx);}.fi.l{background:var(--card);color:var(--faint);border:1px solid var(--line2);}
.pe{display:grid;grid-template-columns:minmax(0,1fr) auto 48px;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);}
.pe:first-child{border-top:0;}.pe:hover{background:var(--card2);}
.pe-n b{display:block;font:700 14.5px 'Inter',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.pe-n small{font-size:12px;color:var(--faint);}
.pe-f{font:600 12.5px 'Inter',sans-serif;color:var(--dim);white-space:nowrap;}.pe-f.gold{color:var(--gold);font-weight:800;}.pe-f.in{color:var(--acc);}
.pe-r{font:700 15px 'Space Grotesk',sans-serif;text-align:right;color:var(--dim);}
.pmr{display:grid;grid-template-columns:44px 62px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);}
.pmr:first-child{border-top:0;}.pmr.live{background:var(--live-soft);}
.pmr .res{height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font:800 12px 'Inter',sans-serif;}
.pmr .res.w{background:var(--win);color:var(--win-tx);}.pmr .res.l{background:var(--sunk);color:var(--faint);}.pmr .res.lv{background:var(--live);color:#fff;font-size:10px;}
.pmr .sc{font:700 18px 'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;}
.pmr .op{min-width:0;font:600 14px 'Inter',sans-serif;color:var(--dim);}.pmr .op a{color:var(--text);font-weight:700;}.pmr .op small{display:block;font:500 11.5px 'Inter',sans-serif;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.h2h{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);}
.h2h:first-child{border-top:0;}.h2h:hover{background:var(--card2);}
.h2h .op{flex:1;min-width:0;}.h2h .op b{display:block;font:700 14.5px 'Inter',sans-serif;}.h2h .op small{font:700 10.5px 'Inter',sans-serif;color:var(--faint);letter-spacing:.4px;}
.h2h .rec{text-align:right;}.h2h .rec i{display:block;font:700 18px 'Space Grotesk',sans-serif;font-style:normal;}.h2h .rec i.up{color:var(--pos);}.h2h .rec i.dn{color:var(--neg);}.h2h .rec small{font-size:11px;color:var(--faint);}
.rcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.rc{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px;padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);}
.rc:hover{border-color:var(--acc);}
.rc:before{content:'';position:absolute;right:-24px;top:0;width:56px;height:6px;background:var(--gold-fill);transform:skewX(-30deg);}
.rc .ri{font-size:22px;}.rc b{font:700 38px/1.05 'Space Grotesk',sans-serif;letter-spacing:-1px;margin-top:6px;}.rc .rl{font:700 12px 'Inter',sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);}
.rc .rn{font:700 15.5px 'Inter',sans-serif;margin-top:8px;}.rc small{font-size:12px;color:var(--faint);}
.hof{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;}
.hc2{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);}
.hc-top{position:relative;display:flex;align-items:center;gap:14px;padding:18px;background:var(--gold-soft);border-bottom:1px solid var(--line);}
.hc-top .tr{font-size:34px;}.hc-top small{display:block;font:700 11.5px 'Inter',sans-serif;color:var(--gold);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hc-top a{display:block;font:700 24px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.5px;margin-top:3px;}
.hc-top .shb{margin-left:auto;}
.hc-b{display:flex;flex-direction:column;gap:6px;padding:14px 18px 16px;font-size:13.5px;color:var(--dim);}
.hc-b a{color:var(--text);font-weight:700;}.hc-b .chip{align-self:flex-start;margin-top:6px;color:var(--acc);}
@media (max-width:760px){.top{flex-wrap:wrap;height:auto!important;row-gap:0;padding-top:8px!important;}.top .logo{height:44px;}
  .nav{order:5;flex-basis:100%;margin:0 -12px!important;padding:4px 12px 8px;overflow-x:auto;scrollbar-width:none;}.nav::-webkit-scrollbar{display:none;}.nav a{flex:none;height:34px;}
  .stg{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}.stt{padding:14px;}.stt b{font-size:28px;}
  .rcg{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}.rc{padding:14px;}.rc b{font-size:28px;}
  .pf-av{width:56px;height:56px;font-size:22px;}.pmr{grid-template-columns:38px 54px minmax(0,1fr) auto;gap:8px;padding:10px 12px;}}
@media (max-width:600px){.pod{gap:6px;}.pd b{font-size:14px;}.pd.p1 b{font-size:16px;}.pd em{display:none;}}
@media (max-width:980px){.watch{grid-template-columns:1fr;}.ov-grid{grid-template-columns:1fr;}}
@media (max-width:760px){
  .mi{grid-template-columns:52px minmax(0,1fr) 54px minmax(0,1fr) 30px;gap:7px;padding:10px 10px;font-size:13.5px;}
  .mi .shb{width:30px;height:30px;}
  .mi .tb,.mi .rd,.mi .a small,.mi .b small{display:none;}.mi .tm small{display:none;}.mi .tm small.soon{display:block;margin:0;}
  .vtab{padding:9px 12px;font-size:13.5px;}.vtab small{display:none;}
  .ev-hero{padding:20px 18px;}.ev-hero:before{width:90px;right:-50px;}.ev-hero:after{display:none;}.ev-hero > *{max-width:calc(100% - 40px);}
  .pl-grid{grid-template-columns:1fr;}
}
@media (max-width:760px){.ytb span{display:none;}.ytb{padding:0 11px;}}
@media (max-width:760px){
  .top{padding:0 12px;gap:8px;height:58px;}.nav{margin-left:0;}.nav a{padding:0 10px;font-size:13px;}.clock,.logo span{display:none;}
  .wrap{padding:16px 12px 50px;}
  .ggrid{grid-template-columns:1fr;}
  .rr{grid-template-columns:1fr auto 1fr;}.rr .t,.rr .e{display:none;}
}

  <a class="logo" href="#live"><img src="upbsa-logo.jpg" alt=""><span>UPBSA<i>.TV</i></span></a>
  <nav class="nav">
    <a href="#live" id="n-live">Live <span class="cnt" id="n-cnt" style="display:none">0</span></a>
    <a href="#events" id="n-events">Events</a>
    <a href="#players" id="n-players">Players</a>

  h += '<div class="sec">Records</div>' + (recs ? '<div class="rcg">' + recs + '</div>' : '<div class="empty">Records appear once matches are played.</div>');
  /* champions */
  h += '<div class="sec">Champions <b>' + ev.length + '</b></div>' + (ev.length ? '<div class="hof">' + ev.map(function(e){ var t = e.t, fin = e.md.all.filter(function(v){ return v.roundName === 'Final' && v.status === 'done'; })[0];
    var sc = fin ? (pkey(pname(fin.p1)) === pkey(e.champ.name) ? fin.f1 + '–' + fin.f2 : fin.f2 + '–' + fin.f1) : '';
    return '<div class="hc2"><div class="hc-top"><span class="tr">🏆</span><div style="min-width:0"><small>' + esc(t.name) + (e.c.name && e.c.name.toLowerCase() !== 'open' ? ' · ' + esc(e.c.name) : '') + '</small><a href="' + plink(e.champ.name) + '">' + esc(e.champ.name) + '</a></div>' +
      '<button class="shb" data-share="c:' + esc(e.tid + '|' + e.ck) + '" aria-label="Share champion card" title="Share champion card">⤴</button></div>' +
      '<div class="hc-b">' + (e.runner ? '<span>Beat <a href="' + plink(e.runner.name) + '">' + esc(e.runner.name) + '</a>' + (sc ? ' <b>' + esc(sc) + '</b>' : '') + ' in the final</span>' : '') +
      '<span>' + esc([t.startDate ? fmtD(t.startDate) : '', t.venue || ''].filter(Boolean).join(' · ')) + '</span><a class="chip" href="#e/' + e.tid + '/' + e.ck + '/rankings">Final standings →</a></div></div>'; }).join('') + '</div>' : '<div class="empty">Champions are added here when a final is won.</div>');
  /* finished events with no champion yet but under way */
  return h;
}

/* ── YouTube: a "go to livestream" button on every match that's being streamed ── */
function streamUrl(id){ return 'https://www.youtube.com/watch?v=' + id; }
function tableStream(n){ var x = n && streamForTable(+n); return x ? streamUrl(x.id) : ''; }
BK.watchUrl = function(v){ return v && v.status === 'live' ? tableStream(v.table) : ''; };   // used by the bracket boxes
function topButton(){
  var sl = streams(), b = g('ytb'), ch = window.YT ? YT.channelUrl(YC) : 'https://www.youtube.com/@upbsa';
  b.href = sl.length === 1 ? streamUrl(sl[0].id) : sl.length ? ch + '/streams' : ch;
  b.classList.toggle('live', sl.length > 0); g('ytb-t').textContent = sl.length ? 'Live on YouTube' : 'YouTube';
}
document.addEventListener('click', function(e){
  var sc = e.target.closest('[data-sec]'); if(sc){ var r = route(); secSel[r.ck + ':' + (stageSel[r.ck] || 0)] = sc.dataset.sec; var w0 = document.querySelector('.bt-wrap'); if(w0){ w0.scrollTop = 0; w0.scrollLeft = 0; } jumpTo = find ? 'sec' : ''; draw(); var w1 = document.querySelector('.bt-wrap'); if(w1 && !find){ w1.scrollTop = 0; w1.scrollLeft = 0; } return; }
  var mf = e.target.closest('[data-mf]'); if(mf){ mfilt = mf.dataset.mf; draw(); return; }
  var so = e.target.closest('[data-sort]'); if(so){ statSort = so.dataset.sort; draw(); return; }
  var tr = e.target.closest('[data-trace]'); if(tr){ find = tr.dataset.trace.toLowerCase(); jumpTo = 'follow'; return; }
  var fo = e.target.closest('[data-follow]'); if(fo){ find = ''; location.hash = plink(fo.dataset.follow); return; }
  var bp = e.target.closest('.bt-p[data-p]'); if(bp && bp.dataset.p && !e.target.closest('a')){ find = find === bp.dataset.p ? '' : bp.dataset.p; draw(); return; }
});
document.addEventListener('mouseover', function(e){   // hover a player: light up their whole path
  var p = e.target.closest('.bt-p[data-p]'), was = document.querySelectorAll('.bt-p.path');
  for(var i = 0; i < was.length; i++) was[i].classList.remove('path');
  if(!p || !p.dataset.p) return;
  document.querySelectorAll('.bt-p[data-p="' + CSS.escape(p.dataset.p) + '"]').forEach(function(x){ x.classList.add('path'); });
});
document.addEventListener('click', function(e){   // buttons inside cards that are links themselves
  var w = e.target.closest('[data-yt]'); if(!w) return;
  e.preventDefault(); e.stopPropagation(); window.open(w.dataset.yt, '_blank', 'noopener');
}, true);

/* ── share cards ── */
function shareData(spec){
  var kind = spec[0], arg = spec.slice(2), parts = arg.split('|'), t = T[parts[0]];
  var model = function(){ return t ? BK.model(t, parts[1], ctx()) : null; };
  var catName = function(){ var d = t && t.draw && t.draw[parts[1]]; var n = d && d.catName || ''; return n && n.toLowerCase() !== 'open' ? n : ''; };
  if(kind === 'm'){ var md = model(); if(!md) return null; var v = md.all.filter(function(x){ return x.key === parts[2]; })[0]; if(!v) return null; var d = dt(v);
    return ['match', { event:t.name, sub:t.subtitle, round:[v.roundName, v.bo ? 'Best of ' + v.bo : ''].filter(Boolean).join(' · '), a:v.p1.name, ad:v.p1.state, fa:v.wo ? (v.w === 1 ? 'W' : '–') : v.f1, b:v.p2.name, bd:v.p2.state, fb:v.wo ? (v.w === 2 ? 'W' : '–') : v.f2, w:v.w,
      meta:[catName(), d ? d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'numeric' }) : '', v.table ? 'Table ' + v.table : '', v.wo ? 'Walkover' : ''].filter(Boolean).join('  ·  '),
      shareText:v.p1.name + ' ' + v.f1 + '–' + v.f2 + ' ' + v.p2.name + ' · ' + (v.roundName || '') + ' · ' + t.name }, v.p1.name + '-v-' + v.p2.name];
  }
  if(kind === 'c' || kind === 'r'){ var md2 = model(); if(!md2) return null;
    var rows = BK.applyManual(BK.standings(md2), (t.rankings || {})[parts[1]]);
    if(kind === 'c'){ var ch = rows.filter(function(x){ return x.champ; })[0] || (md2.champion && { name:md2.champion.name, state:md2.champion.state }); if(!ch) return null;
      var ru = rows.filter(function(x){ return x.place === 2; })[0], fin = md2.all.filter(function(v){ return v.roundName === 'Final' && v.status === 'done'; })[0];
      var sc = fin ? (pkey(pname(fin.p1)) === pkey(ch.name) ? fin.f1 + '–' + fin.f2 : fin.f2 + '–' + fin.f1) : '';
      return ['champion', { event:t.name, sub:t.subtitle, cat:catName(), name:ch.name, state:ch.state, final:ru ? 'Beat ' + ru.name + (sc ? ' ' + sc : '') + ' in the final' : '', meta:[t.startDate ? fmtD(t.startDate) : '', t.venue || ''].filter(Boolean).join('  ·  '), shareText:'🏆 ' + ch.name + ' wins ' + t.name }, 'champion-' + ch.name];
    }
    var man = (t.rankings || {})[parts[1]], off = !!(man && man.on);
    var pos = function(x){ return x.lo === x.hi ? (x.joint ? '=' : '') + x.lo : x.lo + '–' + x.hi; }, prev = null;
    var list = rows.slice(0, 8).map(function(x){ var g = pos(x), show = g !== prev; prev = g; return { pos:show ? g : '', name:x.name, note:off && x.points != null ? x.points + ' pts' : (off && x.note) || x.stage.replace(/^Lost in /, '') }; });
    var done = !!md2.champion;
    return ['standings', { event:t.name, sub:t.subtitle, title:(off ? 'Official rankings' : done ? 'Final standings' : 'Standings') + (catName() ? ' · ' + catName() : ''), rows:list, shareText:t.name + ' standings' }, 'standings-' + t.name];
  }
  if(kind === 'p'){ var P = people().P[arg]; if(!P) return null;
    var fd = P.fw - P.fl, form = P.ms.filter(function(m){ return m.v.status === 'done' && m.v.w; }).slice(0, 10).map(function(m){ return m.v.w === m.side; }).reverse();
    return ['player', { event:P.ev.length + ' event' + (P.ev.length === 1 ? '' : 's') + ' · ' + P.fw + '–' + P.fl + ' frames', sub:'Player card', name:P.name, state:P.state, init:inits(P.name), titles:P.titles, wl:P.w + '–' + P.l, pct:P.pct, fd:(fd > 0 ? '+' : '') + fd, hb:P.hb, form:form, shareText:P.name + ' on UPBSA.TV' }, 'player-' + P.name];
  }
  return null;
}
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-share]'); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  var x = shareData(b.dataset.share); if(x && window.SC) SC.open(x[0], x[1], x[2]);
}, true);

/* ── draw ── */
var raf = 0;
function render(){ if(raf) return; raf = requestAnimationFrame(function(){ raf = 0; draw(); }); }
function draw(){
  var r = route(), y = window.scrollY, active = document.activeElement && document.activeElement.id === 'find', pos = active ? document.activeElement.selectionStart : 0;
  var sx = 0, sy = 0, sw = document.querySelector('#stage .bk-wrap, #stage .bt-wrap'); if(sw){ sx = sw.scrollLeft; sy = sw.scrollTop; }
  nav(r.page); topButton();
  if(r.page === 'e' && r.st != null) stageSel[r.ck] = r.st;
  PEOPLE = null; CUR = null;
  var html = r.page === 'events' ? pageEvents() : r.page === 'results' ? pageResults() : r.page === 'e' ? pageEvent(r) : r.page === 'players' ? pagePlayers() : r.page === 'p' ? pageProfile(decodeURIComponent(location.hash.replace(/^#p\//, ''))) : r.page === 'hall' ? pageHall() : pageLive();
  g('view').innerHTML = html;
  if(r.page === 'e' && r.st != null && T[r.tid]) stageSel[r.ck] = +r.st;
  var f0 = g('find'); if(f0) f0.addEventListener('input', function(){ jumpTo = 'find'; });
  var f = g('find'); if(f){ f.oninput = function(){ find = f.value.trim().toLowerCase(); draw(); }; if(active){ f.focus(); try { f.setSelectionRange(pos, pos); } catch(e){} } }
  if(find) document.querySelectorAll('.bk-p[data-p]').forEach(function(p){ if(p.dataset.p && p.dataset.p.indexOf(find) >= 0) p.classList.add('hl'); });
  var nw = document.querySelector('#stage .bk-wrap, #stage .bt-wrap'); if(nw && !jumpTo){ if(sx) nw.scrollLeft = sx; if(sy) nw.scrollTop = sy; }
  if(find) document.querySelectorAll('.bt-p[data-p]').forEach(function(p){ if(p.dataset.p && p.dataset.p.indexOf(find) >= 0) p.classList.add('hl'); });
  window.scrollTo(0, y);
  if(jumpTo && nw){ var tgt = nw.querySelector('.bt-p.hl'); if(tgt){ var m = tgt.closest('.bt-m'); nw.scrollTop = Math.max(0, m.offsetTop - 60); nw.scrollLeft = Math.max(0, m.offsetLeft - 40); try { m.scrollIntoView({ block:'nearest', inline:'nearest' }); } catch(e){} } }
  jumpTo = '';
  var lc = Object.keys(M).filter(function(k){ return M[k] && M[k].player1 && M[k].status !== 'finished'; }).length;
  g('n-cnt').textContent = lc; g('n-cnt').style.display = lc ? '' : 'none';
  document.title = (lc ? '● ' : '') + 'Live Draws & Results — UPBSA.TV';
}
db.ref('tournaments').on('value', function(s){ T = s.val() || {}; render(); });
db.ref('matches').on('value', function(s){ M = s.val() || {}; render(); });
db.ref('match_registry').on('value', function(s){ R = s.val() || {}; render(); });
BK.watchResults(db, render);

db.ref('live/youtube').on('value', function(s){ YA = s.val() || {}; render(); });
db.ref('live/streams').on('value', function(s){ YM = s.val() || {}; render(); });
db.ref('breaks').on('value', function(s){ BRK = s.val() || {}; var rp = route(); if(rp.view === 'stats' || rp.view === 'rankings' || rp.view === 'overview' || rp.page === 'p' || rp.page === 'hall' || rp.page === 'players') render(); });
db.ref('match_history').limitToLast(400).on('value', function(s){ HIST = s.val() || {}; if(route().page === 'results') render(); });
setInterval(function(){ g('clock').textContent = new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }); }, 1000);
render();
