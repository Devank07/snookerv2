<style>
:root{--bg:#050a06;--card:#0d1b12;--card2:#102218;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.12);--text:#e8f4e0;--dim:rgba(232,244,224,.55);--faint:rgba(232,244,224,.32);--gold:#f0c040;--green:#2ecc71;--blue:#5fb8ff;
  --bk-card:#0d1b12;--bk-gold:#f0c040;}
*{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);}
body{min-height:100vh;background:radial-gradient(ellipse 120% 60% at 50% -10%,#163a24 0%,#071209 55%,var(--bg) 100%) no-repeat,var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
/* top */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:0 20px;height:60px;background:rgba(5,10,6,.88);backdrop-filter:blur(10px);border-bottom:1px solid rgba(240,192,64,.22);}
.logo{display:flex;align-items:center;gap:10px;font:900 20px 'Barlow Condensed',sans-serif;letter-spacing:3px;}
.logo img{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(240,192,64,.55);object-fit:cover;}
.logo i{font-style:normal;color:var(--gold);}
.nav{display:flex;gap:4px;margin-left:12px;}
.nav a{height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 14px;border-radius:9px;font:800 15px 'Barlow Condensed',sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);}
.nav a:hover{color:var(--text);background:rgba(255,255,255,.04);}
.nav a.on{color:var(--gold);background:rgba(240,192,64,.1);}
.nav .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--green);color:#04140a;font:800 12px 'Inter',sans-serif;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0;}
.sp{flex:1;}
.clock{font:400 24px 'Bebas Neue',sans-serif;letter-spacing:2px;color:var(--faint);}
.wrap{max-width:1500px;margin:0 auto;padding:22px 20px 60px;}
.h1{font:900 clamp(28px,4vw,44px)/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.5px;}
.h1 em{font-style:normal;color:var(--gold);}
.sub{color:var(--dim);font-size:14px;margin-top:6px;}
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font:900 14px 'Barlow Condensed',sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--dim);}
.sec:after{content:'';flex:1;height:1px;background:var(--line);}
.sec b{color:var(--text);font:400 20px 'Bebas Neue',sans-serif;letter-spacing:1px;}
.empty{padding:34px 18px;text-align:center;color:var(--dim);border:1px dashed var(--line2);border-radius:16px;}
/* live cards */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;}
.lc{display:block;border-radius:16px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);overflow:hidden;transition:border-color .2s,transform .2s;}
.lc:hover{border-color:rgba(240,192,64,.4);transform:translateY(-2px);}
.lc.live{border-color:rgba(46,204,113,.45);}
.lc-h{display:flex;align-items:center;gap:8px;padding:11px 14px 0;font:800 12px 'Barlow Condensed',sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.lc-h .lv{color:#59e08a;}.lc-h .lv:before{content:'● ';animation:blink 1.2s steps(2) infinite;}@keyframes blink{50%{opacity:.25}}
.lc-h .sp{flex:1;}
.lc-ev{padding:2px 14px 0;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lc-b{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 14px 14px;}
.lc-p{min-width:0;}.lc-p.r{text-align:right;}
.lc-n{font:800 21px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.lc-n .at{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);margin:0 6px 3px;vertical-align:middle;}
.lc-st{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.lc-pts{font:400 34px/1 'Bebas Neue',sans-serif;margin-top:4px;}
.lc-pts small{font:700 12px 'Barlow Condensed',sans-serif;color:var(--gold);letter-spacing:1px;margin:0 6px;vertical-align:middle;}
.lc-fr{text-align:center;padding:6px 12px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);font:400 32px/1 'Bebas Neue',sans-serif;}
.lc-fr small{display:block;font:700 10px 'Barlow Condensed',sans-serif;letter-spacing:2px;color:var(--dim);margin-top:2px;}
/* events */
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.ec{display:block;padding:18px;border-radius:16px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);transition:border-color .2s,transform .2s;}
.ec:hover{border-color:rgba(240,192,64,.45);transform:translateY(-2px);}
.ec-t{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.badge{padding:3px 8px;border-radius:6px;font:800 11px 'Barlow Condensed',sans-serif;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.06);color:var(--dim);}
.badge.live{background:rgba(46,204,113,.15);color:#59e08a;}.badge.done{background:rgba(95,184,255,.14);color:var(--blue);}.badge.gold{background:rgba(240,192,64,.14);color:var(--gold);}
.ec-n{font:900 24px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;}
.ec-m{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.5;}
.ec-c{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;}
.ec-c span{padding:4px 9px;border-radius:999px;border:1px solid var(--line2);font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:1px;color:var(--dim);}
.ec-ch{margin-top:12px;font-size:13px;color:var(--gold);}
/* event page */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font:700 13px 'Inter',sans-serif;margin-bottom:12px;}
.back:hover{color:var(--text);}
.ehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;}
.tab{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--dim);font:800 15px 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.tab.on{background:var(--gold);border-color:var(--gold);color:#0b0b0b;}
.tab .dotl{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
.stabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line);}
.stab{padding:10px 14px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--dim);font:800 14px 'Barlow Condensed',sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;}
.stab.on{color:var(--gold);border-bottom-color:var(--gold);}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 6px;}
.find{height:38px;min-width:220px;flex:0 1 320px;border-radius:10px;border:1px solid var(--line2);background:rgba(0,0,0,.35);color:#fff;padding:0 12px;font:500 14px 'Inter',sans-serif;}
.find:focus{outline:none;border-color:var(--gold);}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--faint);}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.champ{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px 18px;border-radius:14px;border:1px solid rgba(240,192,64,.5);background:linear-gradient(90deg,rgba(240,192,64,.18),rgba(240,192,64,.02));}
.champ .tr{font-size:34px;}.champ b{display:block;font:400 34px/1 'Bebas Neue',sans-serif;color:var(--gold);letter-spacing:1px;}.champ span{font:800 12px 'Barlow Condensed',sans-serif;letter-spacing:3px;color:var(--dim);}
/* groups */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;}
.gc{border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden;}
.gc-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(0,0,0,.25);border-bottom:1px solid var(--line);}
.gc-h b{font:900 18px 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;}
.gc-h span{font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;}
table.st{width:100%;border-collapse:collapse;font-size:14px;}
table.st th{padding:8px 6px;font:800 11px 'Barlow Condensed',sans-serif;letter-spacing:2px;color:var(--faint);text-align:center;text-transform:uppercase;}
table.st th:nth-child(2){text-align:left;}
table.st td{padding:9px 6px;border-top:1px solid rgba(255,255,255,.05);text-align:center;font-variant-numeric:tabular-nums;}
table.st td:nth-child(1){width:34px;color:var(--faint);font:400 18px 'Bebas Neue',sans-serif;}
table.st td:nth-child(2){text-align:left;font:800 16px 'Barlow Condensed',sans-serif;text-transform:uppercase;}
table.st td:nth-child(2) small{display:block;font:600 11px 'Inter',sans-serif;color:var(--faint);text-transform:none;}
table.st tr.q td:nth-child(1){color:var(--gold);}
table.st tr.q td:nth-child(2){box-shadow:inset 3px 0 0 var(--gold);}
table.st td.pts{font:400 20px 'Bebas Neue',sans-serif;color:var(--gold);}
table.st tr.hl td{background:rgba(95,184,255,.12);}
.gm{padding:6px 10px 10px;display:flex;flex-direction:column;gap:6px;}
.mr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.22);font:700 14px 'Barlow Condensed',sans-serif;text-transform:uppercase;}
.mr .a{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.mr .b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mr .w{color:var(--gold);}.mr .l{opacity:.5;}
.mr .sc{min-width:64px;text-align:center;font:400 19px 'Bebas Neue',sans-serif;letter-spacing:1px;}
.mr .sc small{display:block;font:700 9.5px 'Barlow Condensed',sans-serif;letter-spacing:1.5px;color:var(--faint);}
.mr.live{background:rgba(46,204,113,.1);box-shadow:inset 0 0 0 1px rgba(46,204,113,.35);}
.mr.live .sc small{color:#59e08a;}
.mr.hl{box-shadow:inset 0 0 0 1px rgba(95,184,255,.6);}
/* results */
.rlist{display:flex;flex-direction:column;gap:8px;}
.rr{display:grid;grid-template-columns:110px 1fr auto 1fr 180px;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font:700 16px 'Barlow Condensed',sans-serif;text-transform:uppercase;}
.rr .t{font:500 12px 'Inter',sans-serif;color:var(--faint);text-transform:none;}
.rr .a{text-align:right;}.rr .w{color:var(--gold);}.rr .l{opacity:.55;}
.rr .sc{font:400 24px 'Bebas Neue',sans-serif;min-width:70px;text-align:center;}
.rr .e{font:500 12px 'Inter',sans-serif;color:var(--faint);text-transform:none;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bk-empty{padding:24px;text-align:center;color:var(--dim);}
/* YouTube */
.ytb{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;background:#ff0033;color:#fff;font:800 14px 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;box-shadow:0 4px 14px rgba(255,0,51,.3);}
.ytb:hover{background:#ff1a47;}
.ytb.live:before{content:'';width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s steps(2) infinite;}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start;}
.player{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid rgba(255,0,51,.4);box-shadow:0 18px 50px rgba(0,0,0,.5);}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.wlist{display:flex;flex-direction:column;gap:8px;}
.wl-h{font:900 14px 'Barlow Condensed',sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px;}
.wl-h:before{content:'';width:8px;height:8px;border-radius:50%;background:#ff0033;box-shadow:0 0 8px #ff0033;animation:blink 1.2s steps(2) infinite;}
.wi{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;}
.wi:hover{border-color:rgba(255,0,51,.5);}
.wi.on{border-color:#ff0033;background:rgba(255,0,51,.1);}
.wi img,.wi .ph{width:96px;height:54px;border-radius:8px;object-fit:cover;flex:none;background:#111;display:flex;align-items:center;justify-content:center;font-size:20px;}
.wi b{display:block;font:800 15px/1.15 'Barlow Condensed',sans-serif;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.wi span{font-size:12px;color:var(--faint);}
.wl-sub{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:12px;background:#ff0033;color:#fff;font:800 15px 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;margin-top:4px;}
.ytcta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 18px;border-radius:16px;background:linear-gradient(90deg,rgba(255,0,51,.14),rgba(255,0,51,.03));border:1px solid rgba(255,0,51,.35);margin-bottom:6px;}
.ytcta b{display:block;font:900 20px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.5px;}
.ytcta span{color:var(--dim);font-size:13px;}
.ytcta .sp{flex:1;}
.watchbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:#ff0033;color:#fff;font:800 12px 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
.ytbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border-radius:12px;background:rgba(255,0,51,.1);border:1px solid rgba(255,0,51,.35);font:700 14px 'Barlow Condensed',sans-serif;letter-spacing:.5px;text-transform:uppercase;}
.ytbar a{color:#fff;padding:5px 12px;border-radius:999px;background:#ff0033;font-size:13px;letter-spacing:1px;}
.mr-yt{grid-column:1/-1;justify-self:center;margin-top:4px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:#ff0033;color:#fff;font:800 12px 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;}
.bk-yt{display:inline-flex;align-items:center;gap:4px;height:16px;padding:0 7px;border-radius:999px;background:#ff0033;color:#fff!important;font:800 10px 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;text-decoration:none;}
.lc-yt{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;background:#ff0033;color:#fff;font:800 15px 'Barlow Condensed',sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;}
.lc-yt:hover{background:#ff1a47;}
@media (max-width:980px){.watch{grid-template-columns:1fr;}}
@media (max-width:760px){.ytb span{display:none;}.ytb{padding:0 10px;}}
@media (max-width:760px){
  .top{padding:0 12px;gap:8px;height:56px;}.nav{margin-left:0;}.nav a{padding:0 9px;font-size:13px;}.clock,.logo span{display:none;}
  .wrap{padding:16px 12px 50px;}
  .ggrid{grid-template-columns:1fr;}
  .rr{grid-template-columns:1fr auto 1fr;}.rr .t,.rr .e{display:none;}
}
</style>

  if(draw){ Object.keys(draw.matches || {}).some(function(x){ if(draw.matches[x].matchId === m.matchId){ vm = draw.matches[x]; return true; } }); }
  var ys = live && streamForTable(n);
  return '<a class="lc' + (live ? ' live' : '') + '" href="' + href + '"><div class="lc-h"><span>Table ' + n + '</span>' + (live ? '<span class="lv">Live</span>' : '<span class="badge done">Finished</span>') + '' +
    '<span class="sp"></span><span>' + (vm && vm.roundName ? esc(vm.roundName) + ' · ' : '') + 'Frame ' + esc(m.currentFrame || 1) + ' · BO' + esc(m.bestOf || '') + '</span></div>' +
    '<div class="lc-ev">' + esc(m.tournament || '') + (w ? ' · ' + esc(T[w.tid].draw[w.ck].catName || '') : '') + '</div>' +
    '<div class="lc-b"><div class="lc-p"><div class="lc-n">' + esc(p1.name || 'Player 1') + (at1 ? '<span class="at"></span>' : '') + '</div><div class="lc-st">' + esc(p1.state || '') + '</div><div class="lc-pts">' + esc(p1.score || 0) + (at1 && brk ? '<small>BREAK ' + brk + '</small>' : '') + '</div></div>' +
    '<div class="lc-fr">' + esc(p1.frames || 0) + '–' + esc(p2.frames || 0) + '<small>FRAMES</small></div>' +
    '<div class="lc-p r"><div class="lc-n">' + (at2 ? '<span class="at"></span>' : '') + esc(p2.name || 'Player 2') + '</div><div class="lc-st">' + esc(p2.state || '') + '</div><div class="lc-pts">' + (at2 && brk ? '<small>BREAK ' + brk + '</small>' : '') + esc(p2.score || 0) + '</div></div></div>' + (ys ? '<span class="lc-yt" data-yt="' + streamUrl(ys.id) + '" title="Opens the live stream on YouTube">▶ Go to livestream</span>' : '') + '</a>';
}
function pageLive(){
  var keys = Object.keys(M).filter(function(k){ return M[k] && M[k].player1; }).sort(function(a,b){ return parseInt(a.replace('table-',''),10) - parseInt(b.replace('table-',''),10); });
  var live = keys.filter(function(k){ return M[k].status !== 'finished'; }), done = keys.filter(function(k){ return M[k].status === 'finished'; });
  var h = '<div class="h1">Live <em>now</em></div><div class="sub">Scores update by themselves — tap a match to see its draw.</div>';
  h += '<div class="sec">On the tables <b>' + live.length + '</b></div>';
  h += live.length ? '<div class="lgrid">' + live.map(function(k){ return liveCard(k, M[k]); }).join('') + '</div>' : '<div class="empty">No matches being played right now.</div>';
  if(done.length) h += '<div class="sec">Just finished</div><div class="lgrid">' + done.map(function(k){ return liveCard(k, M[k]); }).join('') + '</div>';
  // upcoming from draws
  var up = [];
  Object.keys(T).forEach(function(tid){ var t = T[tid]; cats(t).forEach(function(c){ if(!c.d) return; var md = BK.model(t, c.key, ctx()); if(!md) return;
    md.all.forEach(function(v){ if(v.status === 'pending' && !BK.isTbd(v.p1) && !BK.isTbd(v.p2) && !BK.isBye(v.p1) && !BK.isBye(v.p2) && (v.table || v.datetime)) up.push({ v:v, t:t, c:c, tid:tid }); }); }); });
  up.sort(function(a,b){ return String(a.v.datetime || '9').localeCompare(String(b.v.datetime || '9')); });
  if(up.length) h += '<div class="sec">Coming up</div><div class="rlist">' + up.slice(0, 12).map(function(x){ var v = x.v;
    return '<a class="rr" href="#e/' + x.tid + '/' + x.c.key + '"><span class="t">' + (v.datetime ? esc(BK.fmtTime(v.datetime)) : 'Table ' + v.table) + '</span><span class="a">' + esc(v.p1.name) + '</span><span class="sc" style="font-size:16px;color:var(--dim)">v</span><span>' + esc(v.p2.name) + '</span><span class="e">' + esc(x.c.name) + ' · ' + esc(v.roundName || '') + (v.table ? ' · T' + v.table : '') + '</span></a>'; }).join('') + '</div>';
  return h;
}

/* ── events ── */
function pageEvents(){
  var ids = Object.keys(T).filter(function(id){ return T[id] && T[id].name; }).sort(function(a,b){ return (T[b].createdAt || 0) - (T[a].createdAt || 0); });
  var h = '<div class="h1">Events</div><div class="sub">Draws, groups and brackets — updated live as matches finish.</div><div class="sec">All events <b>' + ids.length + '</b></div>';
  if(!ids.length) return h + '<div class="empty">No events yet.</div>';
  return h + '<div class="egrid">' + ids.map(function(id){
    var t = T[id], s = evStatus(t), cs = cats(t), first = cs[0];
    var champs = cs.map(function(c){ return c.d && c.d.champion ? '🏆 ' + esc(c.name) + ': ' + esc(c.d.champion.name) : ''; }).filter(Boolean).join('<br>');
    return '<a class="ec" href="#e/' + id + (first ? '/' + first.key : '') + '"><div class="ec-t">' +
      (s === 'live' ? '<span class="badge live">● Live</span>' : s === 'done' ? '<span class="badge done">Finished</span>' : s === 'on' ? '<span class="badge gold">On now</span>' : '<span class="badge">Coming up</span>') +
      '<span class="badge">' + esc(SPORT[t.sport] || t.sport || '') + '</span></div><div class="ec-n">' + esc(t.name) + '</div>' +
      '<div class="ec-m">' + (t.venue ? '📍 ' + esc(t.venue) + '<br>' : '') + (t.startDate ? '📅 ' + esc(t.startDate) + (t.endDate && t.endDate !== t.startDate ? ' – ' + esc(t.endDate) : '') : '') + '</div>' +
      '<div class="ec-c">' + cs.map(function(c){ return '<span>' + esc(c.name) + '</span>'; }).join('') + '</div>' + (champs ? '<div class="ec-ch">' + champs + '</div>' : '') + '</a>';
  }).join('') + '</div>';
}

/* ── one event ── */
function hl(name){ return find && name && String(name).toLowerCase().indexOf(find) >= 0; }
function mrow(v){
  var cl = v.status === 'live' ? ' live' : '', a = v.w === 1 ? 'w' : v.w === 2 ? 'l' : '', b = v.w === 2 ? 'w' : v.w === 1 ? 'l' : '';
  var sc = v.status === 'done' || v.status === 'live' ? esc(v.f1) + ' – ' + esc(v.f2) : v.status === 'bye' ? 'W/O' : 'v';
  var sm = v.status === 'live' ? 'LIVE' + (v.table ? ' · T' + v.table : '') : v.status === 'done' ? 'FINAL' : v.datetime ? esc(BK.fmtTime(v.datetime)) : v.table ? 'TABLE ' + v.table : (v.bo ? 'BO' + v.bo : '');
  var nm = function(p){ return BK.isBye(p) ? 'BYE' : BK.isTbd(p) ? (p && p.name && !/^tbd$/i.test(p.name) ? p.name : 'TBD') : p.name; };
  var yu = v.status === 'live' ? tableStream(v.table) : '';
  return '<div class="mr' + cl + (hl(v.p1 && v.p1.name) || hl(v.p2 && v.p2.name) ? ' hl' : '') + '"><span class="a ' + a + '">' + esc(nm(v.p1)) + '</span><span class="sc">' + sc + '<small>' + sm + '</small></span><span class="b ' + b + '">' + esc(nm(v.p2)) + '</span>' +
    (yu ? '<a class="mr-yt" href="' + yu + '" target="_blank" rel="noopener">▶ Go to livestream</a>' : '') + '</div>';
}
function stTable(rows, adv, showGroupCol){
  return '<table class="st"><thead><tr><th>#</th><th>Player</th><th>P</th><th>W</th><th>L</th><th>Frames</th><th>+/−</th></tr></thead><tbody>' +
    rows.map(function(r){ return '<tr class="' + (r.pos <= adv && rows.some(function(x){ return x.P; }) ? 'q' : '') + (hl(r.name) ? ' hl' : '') + '"><td>' + r.pos + '</td><td>' + esc(r.name) + (r.state ? '<small>' + esc(r.state) + '</small>' : '') + '</td><td>' + r.P + '</td><td class="pts">' + r.W + '</td><td>' + r.L + '</td><td>' + r.FF + '–' + r.FA + '</td><td>' + (r.FD > 0 ? '+' : '') + r.FD + '</td></tr>'; }).join('') + '</tbody></table>';
}
function stageHtml(s, md){
  if(s.kind === 'ko') return BK.renderKO(s, { champion: md.champion && s === md.stages[md.stages.length - 1] ? md.champion : null });
  if(s.kind === 'groups') return '<div class="ggrid">' + s.groups.map(function(gp){
    return '<div class="gc"><div class="gc-h"><b>' + esc(gp.name) + '</b><span>' + (gp.complete ? 'Complete · ' : '') + 'Top ' + gp.advance + ' go through</span></div>' + stTable(gp.rows, gp.advance) +
      '<div class="gm">' + gp.matches.map(mrow).join('') + '</div></div>'; }).join('') + '</div>';
  return '<div class="ggrid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><div class="gc"><div class="gc-h"><b>Standings</b><span>' + (s.complete ? 'Complete' : 'In progress') + '</span></div>' + stTable(s.rows, s.advance || 1) + '</div>' +
    '<div class="gc"><div class="gc-h"><b>Matches</b><span>' + s.matches.length + '</span></div><div class="gm">' + s.matches.map(mrow).join('') + '</div></div></div>';
}
function pageEvent(r){
  var t = T[r.tid]; if(!t) return '<a class="back" href="#events">← All events</a><div class="empty">This event isn\'t available.</div>';
  var cs = cats(t), c = cs.filter(function(x){ return x.key === r.ck; })[0] || cs[0];
  var h = '<a class="back" href="#events">← All events</a><div class="ehead"><div><div class="h1">' + esc(t.name) + '</div><div class="sub">' +
    [SPORT[t.sport] || t.sport, t.venue, t.startDate ? t.startDate + (t.endDate && t.endDate !== t.startDate ? ' – ' + t.endDate : '') : ''].filter(Boolean).map(esc).join(' · ') + '</div></div></div>';
  if(!cs.length) return h + '<div class="empty" style="margin-top:18px">No categories yet.</div>';
  h += '<div class="tabs">' + cs.map(function(x){
    var live = x.d && Object.keys(x.d.matches || {}).some(function(k){ var lm = ctx().live[x.d.matches[k].matchId]; return lm && lm.status !== 'finished'; });
    return '<a class="tab' + (x === c ? ' on' : '') + '" href="#e/' + r.tid + '/' + x.key + '">' + (live ? '<span class="dotl"></span>' : '') + esc(x.name) + '</a>'; }).join('') + '</div>';
  var md = c.d ? BK.model(t, c.key, ctx()) : null;
  if(!md) return h + '<div class="empty" style="margin-top:18px">The draw for ' + esc(c.name) + ' hasn\'t been made yet.</div>';
  var sl = streams(); if(sl.length) h += '<div class="ytbar"><span style="color:#ff6b86">● Live on YouTube</span>' + sl.map(function(x){ return '<a href="' + streamUrl(x.id) + '" target="_blank" rel="noopener">▶ ' + esc(x.table ? 'Table ' + x.table : (x.title || 'Live stream')) + '</a>'; }).join(' ') + '</div>';
  if(md.champion) h += '<div class="champ"><span class="tr">🏆</span><div><span>' + esc(c.name) + ' champion</span><b>' + esc(md.champion.name) + '</b></div></div>';
  var stages = md.stages, sel = r.st != null ? +r.st : (stageSel[c.key] != null ? stageSel[c.key] : (function(){   // open on the stage that's being played
    var pick = 0; stages.forEach(function(s, i){ var any = (s.kind === 'ko' ? [].concat.apply([], s.rounds.map(function(x){ return x.matches; })) : s.kind === 'groups' ? [].concat.apply([], s.groups.map(function(x){ return x.matches; })) : s.matches)
      .some(function(v){ return v.status === 'live' || v.status === 'done'; }); if(any) pick = i; }); return pick; })());
  if(sel >= stages.length) sel = 0;
  if(stages.length > 1) h += '<div class="stabs">' + stages.map(function(s, i){ return '<a class="stab' + (i === sel ? ' on' : '') + '" href="#e/' + r.tid + '/' + c.key + '/' + i + '">' + esc(s.title) + '</a>'; }).join('') + '</div>';
  h += '<div class="tools"><input class="find" id="find" placeholder="Find a player…" value="' + esc(find) + '"><div class="legend"><span><i style="background:#2ecc71"></i>Live</span><span><i style="background:#f0c040"></i>Winner</span><span><i style="background:#5fb8ff"></i>Your search</span></div></div>';
  h += '<div id="stage">' + stageHtml(stages[sel], md) + '</div>';
  return h;
}

/* ── results ── */
function pageResults(){
  var rows = [];
  Object.keys(HIST).forEach(function(k){ var x = HIST[k]; if(x && x.p1) rows.push({ t:x.endTime || 0, a:x.p1, b:x.p2, f1:x.p1frames, f2:x.p2frames, w:x.winner, ev:x.tournament, tb:x.tableNumber, u:x.unfinished }); });
  var seen = {}; rows.forEach(function(r){ seen[r.a + '|' + r.b + '|' + r.f1 + '|' + r.f2] = 1; });
  Object.keys(R).forEach(function(id){ var r = R[id]; if(r && r.status === 'finished' && r.p1 && r.p1 !== 'TBD'){ var key = r.p1 + '|' + r.p2 + '|' + r.p1frames + '|' + r.p2frames; if(seen[key]) return; seen[key] = 1;
    rows.push({ t:r.endTime || r.startTime || 0, a:r.p1, b:r.p2, f1:r.p1frames, f2:r.p2frames, w:r.winner, ev:r.tournament, rn:r.roundName, tb:r.tableNumber }); } });
  rows.sort(function(a,b){ return b.t - a.t; });
  var h = '<div class="h1">Results</div><div class="sub">Every finished match, newest first.</div><div class="tools"><input class="find" id="find" placeholder="Find a player…" value="' + esc(find) + '"></div><div class="sec">Finished <b>' + rows.length + '</b></div>';
  var list = rows.filter(function(r){ return !find || hl(r.a) || hl(r.b); });
  if(!list.length) return h + '<div class="empty">' + (rows.length ? 'No results for that name.' : 'No finished matches yet.') + '</div>';
  return h + '<div class="rlist">' + list.slice(0, 300).map(function(r){
    var aw = r.w ? r.w === r.a : (+r.f1 > +r.f2), bw = r.w ? r.w === r.b : (+r.f2 > +r.f1);
    var d = r.t ? new Date(r.t) : null;
    return '<div class="rr"><span class="t">' + (d ? d.toLocaleDateString(undefined,{ day:'numeric', month:'short' }) + ' · ' + d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) : '') + '</span><span class="a ' + (aw ? 'w' : bw ? 'l' : '') + '">' + esc(r.a) + '</span><span class="sc">' + esc(r.f1 == null ? '' : r.f1) + '–' + esc(r.f2 == null ? '' : r.f2) + '</span><span class="' + (bw ? 'w' : aw ? 'l' : '') + '">' + esc(r.b) + '</span><span class="e">' + esc(r.ev || '') + (r.rn ? ' · ' + esc(r.rn) : '') + (r.u ? ' · unfinished' : '') + '</span></div>';
  }).join('') + '</div>';
}

/* ── YouTube: a "go to livestream" button on every match that's being streamed ── */
function streamUrl(id){ return 'https://www.youtube.com/watch?v=' + id; }
function tableStream(n){ var x = n && streamForTable(+n); return x ? streamUrl(x.id) : ''; }
BK.watchUrl = function(v){ return v && v.status === 'live' ? tableStream(v.table) : ''; };   // used by the bracket boxes
function topButton(){
  var sl = streams(), b = g('ytb'), ch = window.YT ? YT.channelUrl(YC) : 'https://www.youtube.com/@upbsa';
  b.href = sl.length === 1 ? streamUrl(sl[0].id) : sl.length ? ch + '/streams' : ch;
  b.classList.toggle('live', sl.length > 0); g('ytb-t').textContent = sl.length ? 'Live on YouTube' : 'YouTube';
}
document.addEventListener('click', function(e){   // buttons inside cards that are links themselves
  var w = e.target.closest('[data-yt]'); if(!w) return;
  e.preventDefault(); e.stopPropagation(); window.open(w.dataset.yt, '_blank', 'noopener');
}, true);

/* ── draw ── */
var raf = 0;
function render(){ if(raf) return; raf = requestAnimationFrame(function(){ raf = 0; draw(); }); }
function draw(){
  var r = route(), y = window.scrollY, active = document.activeElement && document.activeElement.id === 'find', pos = active ? document.activeElement.selectionStart : 0;
  var sx = 0, sw = document.querySelector('#stage .bk-wrap'); if(sw) sx = sw.scrollLeft;
  nav(r.page); topButton();
  var html = r.page === 'events' ? pageEvents() : r.page === 'results' ? pageResults() : r.page === 'e' ? pageEvent(r) : pageLive();
  g('view').innerHTML = html;
  if(r.page === 'e' && r.st != null && T[r.tid]) stageSel[r.ck] = +r.st;
  var f = g('find'); if(f){ f.oninput = function(){ find = f.value.trim().toLowerCase(); draw(); }; if(active){ f.focus(); try { f.setSelectionRange(pos, pos); } catch(e){} } }
  if(find) document.querySelectorAll('.bk-p[data-p]').forEach(function(p){ if(p.dataset.p && p.dataset.p.indexOf(find) >= 0) p.classList.add('hl'); });
  var nw = document.querySelector('#stage .bk-wrap'); if(nw && sx) nw.scrollLeft = sx;
  window.scrollTo(0, y);
  var lc = Object.keys(M).filter(function(k){ return M[k] && M[k].player1 && M[k].status !== 'finished'; }).length;
  g('n-cnt').textContent = lc; g('n-cnt').style.display = lc ? '' : 'none';
  document.title = (lc ? '● ' : '') + 'Live Draws & Results — UPBSA.TV';
}
db.ref('tournaments').on('value', function(s){ T = s.val() || {}; render(); });
db.ref('matches').on('value', function(s){ M = s.val() || {}; render(); });
db.ref('match_registry').on('value', function(s){ R = s.val() || {}; render(); });
db.ref('settings/youtube').on('value', function(s){ YC = s.val() || {}; watchKey = ''; render(); });
db.ref('live/youtube').on('value', function(s){ YA = s.val() || {}; render(); });
db.ref('live/streams').on('value', function(s){ YM = s.val() || {}; render(); });
db.ref('match_history').limitToLast(400).on('value', function(s){ HIST = s.val() || {}; if(route().page === 'results') render(); });
setInterval(function(){ g('clock').textContent = new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }); }, 1000);
render();
</script>
</body>
</html>
