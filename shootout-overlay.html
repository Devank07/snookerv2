<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shoot Out Overlay — UPBSA.TV</title>
<!--
  OBS: Browser Source → URL shootout-overlay.html?table=N · 1920 × 1080
  Options:  &pos=top   put the scorebug at the top instead of the bottom
            &edge=1    also glow the screen edges red in the final seconds
-->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="shootout-core.js?v=20261028b"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--gold:#f0c040;--green:#2ecc71;--amber:#f5a623;--red:#ff3b2f;--mblue:#5fb8ff;--fgreen:#59e08a;
  --num:'Bebas Neue',sans-serif;--cond:'Barlow Condensed',sans-serif;--glass:rgba(8,14,10,.92);}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;color:#fff;font-family:var(--cond);}

#edge{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 140px 30px rgba(255,40,20,.85);}

/* ── SCOREBUG ── */
#bug{position:absolute;left:50%;bottom:48px;transform:translateX(-50%) translateY(30px);opacity:0;transition:all .5s cubic-bezier(.2,.9,.3,1.1);width:1380px;}
#bug.show{opacity:1;transform:translateX(-50%);}
body.top #bug{bottom:auto;top:40px;}

/* match strip above */
.mstrip{display:flex;align-items:center;gap:14px;margin:0 auto 6px;width:760px;height:34px;padding:0 16px;border-radius:17px 17px 0 0;background:var(--glass);border:1px solid rgba(95,184,255,.35);border-bottom:none;}
.mstrip i{font-style:normal;font-weight:900;font-size:17px;letter-spacing:5px;color:var(--mblue);}
.mstrip .tr{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;}
.mstrip .tr div{height:100%;background:var(--mblue);transition:width .3s linear,background .3s;}
.mstrip b{font-family:var(--num);font-weight:400;font-size:28px;letter-spacing:2px;min-width:90px;text-align:right;}
.mstrip.warn i,.mstrip.warn b{color:var(--amber);} .mstrip.warn .tr div{background:var(--amber);}
.mstrip.danger i,.mstrip.danger b{color:var(--red);} .mstrip.danger .tr div{background:var(--red);}
.mstrip.off{display:none;}

.row{display:grid;grid-template-columns:1fr 250px 1fr;height:104px;border-radius:12px;overflow:hidden;background:var(--glass);border:2px solid rgba(240,192,64,.55);box-shadow:0 12px 40px rgba(0,0,0,.55);}
.pl{position:relative;display:grid;align-items:center;min-width:0;overflow:hidden;}
.pl.l{grid-template-columns:1fr 70px 120px;}
.pl.r{grid-template-columns:120px 70px 1fr;}
.pl .bgp{position:absolute;inset:0;background:#ff2a1a;opacity:0;pointer-events:none;}
.pl.at{background:linear-gradient(180deg,rgba(46,204,113,.16),rgba(46,204,113,.03));}
.pnm{position:relative;padding:0 22px;min-width:0;}
.pl.r .pnm{text-align:right;}
.pnm b{display:block;font-weight:900;font-size:38px;letter-spacing:1px;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pnm small{display:flex;gap:10px;align-items:center;font-weight:700;font-size:16px;letter-spacing:3px;color:rgba(255,255,255,.5);text-transform:uppercase;}
.pl.r .pnm small{justify-content:flex-end;}
.pnm .ex{display:inline-flex;gap:4px;}
.pnm .ex span{width:11px;height:11px;border-radius:50%;border:2px solid var(--gold);}
.pnm .ex span.on{background:var(--gold);}
.pnm .at-dot{width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);display:none;}
.pl.at .at-dot{display:inline-block;}
.pfr{position:relative;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:56px;background:rgba(255,255,255,.06);border-left:1px solid rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.08);}
.psc{position:relative;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:80px;color:#0b0b0b;background:linear-gradient(180deg,#ffd862,#d9a514);}
.psc.pop{animation:pop .35s ease;}
@keyframes pop{40%{filter:brightness(1.5);transform:scale(1.06);}}

/* the per-player shot timer bar */
.sbar{position:absolute;left:0;right:0;bottom:0;height:12px;background:rgba(255,255,255,.08);}
.sbar div{height:100%;width:100%;background:var(--green);}
.pl.l .sbar div{margin-left:auto;}          /* left player's bar drains towards the centre */
.pl:not(.at) .sbar div{opacity:.18;}
.sbar.warn div{background:var(--amber);}
.sbar.danger div{background:var(--red);box-shadow:0 0 14px var(--red);}

.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#14361f,#0a1d10);border-left:2px solid rgba(240,192,64,.4);border-right:2px solid rgba(240,192,64,.4);position:relative;}
.mid i{font-style:normal;font-weight:900;font-size:16px;letter-spacing:4px;color:var(--fgreen);}
.mid b{font-family:var(--num);font-weight:400;font-size:52px;line-height:.95;letter-spacing:2px;}
.mid small{font-weight:800;font-size:15px;letter-spacing:3px;color:rgba(255,255,255,.55);}
.mid .ftr{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.08);}
.mid .ftr div{height:100%;background:var(--fgreen);transition:width .3s linear;}
.mid.warn b,.mid.warn i{color:var(--amber);} .mid.warn .ftr div{background:var(--amber);}
.mid.danger b,.mid.danger i{color:var(--red);} .mid.danger .ftr div{background:var(--red);}
.mid.nof b{font-size:40px;}

/* info strip under the bug */
.under{display:flex;justify-content:space-between;width:1100px;margin:0 auto;height:32px;padding:0 18px;align-items:center;border-radius:0 0 14px 14px;background:rgba(8,14,10,.85);font-weight:800;font-size:17px;letter-spacing:3px;color:rgba(255,255,255,.6);text-transform:uppercase;}
.under b{color:#fff;}
.under .ph{display:flex;gap:6px;}
.under .ph span{padding:1px 10px;border-radius:5px;border:1px solid rgba(255,255,255,.2);font-size:15px;}
.under .ph span.on{background:var(--green);border-color:var(--green);color:#04140a;}
.under .ph span.on.p2{background:var(--amber);border-color:var(--amber);}
.paused{color:var(--amber) !important;}

/* ── STINGER (slides up above the bug) ── */
#stg{position:absolute;left:50%;bottom:250px;transform:translateX(-50%) translateY(20px);opacity:0;transition:all .4s cubic-bezier(.2,.9,.3,1.2);
  min-width:640px;max-width:1200px;text-align:center;padding:14px 50px 16px;border-radius:12px;background:var(--glass);border:2px solid var(--gold);box-shadow:0 10px 40px rgba(0,0,0,.6);}
body.top #stg{bottom:auto;top:250px;}
#stg.show{opacity:1;transform:translateX(-50%);}
#stg b{display:block;text-transform:uppercase;font-family:var(--num);font-weight:400;font-size:64px;letter-spacing:4px;line-height:1;}
#stg span{display:block;font-weight:800;font-size:22px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.75);margin-top:4px;}
#stg.red{border-color:var(--red);} #stg.red b{color:var(--red);}
#stg.amber{border-color:var(--amber);} #stg.amber b{color:var(--amber);}
#stg.green{border-color:var(--green);} #stg.green b{color:var(--green);}

/* ── FORMAT EXPLAINER ── */
#fmt{position:absolute;left:50%;top:50%;width:1240px;transform:translate(-50%,-50%) scale(.94);opacity:0;transition:all .5s;pointer-events:none;
  border-radius:22px;padding:34px 44px;background:radial-gradient(ellipse at top,rgba(22,58,34,.97),rgba(4,10,6,.97) 75%);border:2px solid rgba(240,192,64,.6);box-shadow:0 20px 80px rgba(0,0,0,.7);}
#fmt.show{opacity:1;transform:translate(-50%,-50%);}
.fx-h{text-align:center;margin-bottom:24px;}
.fx-h i{font-style:normal;font-weight:900;letter-spacing:10px;font-size:20px;color:var(--gold);}
.fx-h b{display:block;font-family:var(--num);font-weight:400;font-size:96px;letter-spacing:5px;line-height:1;}
.fx-h span{display:block;font-weight:700;font-size:22px;letter-spacing:4px;color:rgba(255,255,255,.6);}
.fx-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.fx-c{border-radius:16px;padding:18px 10px;text-align:center;background:rgba(0,0,0,.35);border:2px solid;opacity:0;transform:translateY(20px);}
#fmt.show .fx-c{animation:fxin .6s forwards;}
#fmt.show .fx-c:nth-child(2){animation-delay:.2s;} #fmt.show .fx-c:nth-child(3){animation-delay:.4s;}
@keyframes fxin{to{opacity:1;transform:none;}}
.fx-c i{font-style:normal;display:block;font-weight:900;letter-spacing:8px;font-size:20px;}
.fx-c b{display:block;font-family:var(--num);font-weight:400;font-size:76px;line-height:1.05;}
.fx-c small{display:block;font-weight:600;font-size:17px;letter-spacing:2px;color:rgba(255,255,255,.55);}
.fx-c.m{border-color:var(--mblue);} .fx-c.m i{color:var(--mblue);}
.fx-c.f{border-color:var(--fgreen);} .fx-c.f i{color:var(--fgreen);}
.fx-c.s{border-color:var(--gold);} .fx-c.s i{color:var(--gold);}
.fx-tl{margin-top:24px;}
.fx-tl .bar{display:flex;height:44px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.05);}
.fx-tl .bar div{white-space:nowrap;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;letter-spacing:2px;width:0;white-space:nowrap;overflow:hidden;}
#fmt.show .fx-tl .bar div{animation:grow 1.2s .7s forwards ease-out;}
@keyframes grow{to{width:var(--w);}}
.fx-tl .p1{background:linear-gradient(90deg,#2ecc71,#8ee3a5);color:#04140a;}
.fx-tl .p2{background:linear-gradient(90deg,#f5a623,#ff3b2f);}
.fx-tl .lab{display:flex;justify-content:space-between;margin-top:6px;font-weight:700;font-size:17px;letter-spacing:2px;color:rgba(255,255,255,.55);}
.fx-r{display:grid;grid-template-columns:1fr 1fr;gap:12px 30px;margin-top:22px;}
.fx-r div{display:flex;gap:12px;align-items:center;font-weight:600;font-size:21px;line-height:1.2;}
.fx-r em{font-style:normal;flex-shrink:0;width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);font-size:20px;}
.fx-r b{color:var(--gold);}

/* ── WINNER CARD ── */
#win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;transition:all .6s;pointer-events:none;width:1000px;text-align:center;
  border-radius:22px;padding:34px 40px;background:radial-gradient(ellipse at top,rgba(40,32,8,.97),rgba(6,6,4,.97) 75%);border:3px solid var(--gold);box-shadow:0 0 120px rgba(240,192,64,.35);}
#win.show{opacity:1;transform:translate(-50%,-50%);}
#win i{font-style:normal;font-weight:900;font-size:24px;letter-spacing:12px;color:var(--gold);}
#win b{display:block;font-family:var(--num);font-weight:400;font-size:120px;line-height:1;letter-spacing:3px;}
#win .fs{font-family:var(--num);font-size:64px;color:rgba(255,255,255,.75);}
#win table{width:100%;border-collapse:collapse;margin-top:18px;font-weight:700;font-size:24px;letter-spacing:2px;}
#win td{padding:8px;border-top:1px solid rgba(255,255,255,.12);}
#win td:nth-child(2){color:rgba(255,255,255,.5);font-size:18px;letter-spacing:4px;}
</style>
</head>
<body>
<div id="edge"></div>

<div id="bug">
  <div class="mstrip" id="ms"><i>MATCH</i><div class="tr"><div id="ms-f"></div></div><b id="ms-v">--:--</b></div>
  <div class="row">
    <div class="pl l" id="pl1">
      <div class="bgp" id="bg1"></div>
      <div class="pnm"><b id="n1">–</b><small><span class="at-dot"></span><span id="st1"></span><span class="ex" id="ex1"></span></small></div>
      <div class="pfr" id="f1">0</div>
      <div class="psc" id="s1">0</div>
      <div class="sbar" id="sb1"><div></div></div>
    </div>
    <div class="mid" id="mid"><i id="fl">FRAME 1</i><b id="fv">--:--</b><small id="bo">BEST OF 5</small><div class="ftr"><div id="ff"></div></div></div>
    <div class="pl r" id="pl2">
      <div class="bgp" id="bg2"></div>
      <div class="psc" id="s2">0</div>
      <div class="pfr" id="f2">0</div>
      <div class="pnm"><b id="n2">–</b><small><span class="ex" id="ex2"></span><span id="st2"></span><span class="at-dot"></span></small></div>
      <div class="sbar" id="sb2"><div></div></div>
    </div>
  </div>
  <div class="under"><span id="u-l">–</span><span class="ph" id="u-ph"></span><span id="u-r">–</span></div>
</div>

<div id="stg"><b id="stg-b"></b><span id="stg-s"></span></div>
<div id="fmt"></div>
<div id="win"></div>

<script>
var Q = new URLSearchParams(location.search), tbl = SO.table || '1', S = null;
if(Q.get('pos')==='top') document.body.classList.add('top');
var EDGE = Q.get('edge')==='1';
function g(id){ return document.getElementById(id); }
var prev = { s1:null, s2:null }, lastEv = null, lastPhase = null, stgT = null;

// If a builder design has been put live for Shoot Out, the main overlay page draws it
function isDesign(t){ return !!(t && t.type === 'custom' && t.layers); }
SO.db.ref('design/activeShootout').on('value', function(s){
  if(isDesign(s.val())) location.replace('overlay.html' + location.search);
});
SO.db.ref('design/tables/' + tbl + '/shootout').on('value', function(s){
  if(isDesign(s.val())) location.replace('overlay.html' + location.search);
});

SO.db.ref('matches/table-'+tbl).on('value', function(snap){
  S = snap.val();
  if(S && S.sport && S.sport!=='shootout'){ location.replace('overlay.html?table='+tbl); return; }
  render();
});

function render(){
  var s = S;
  g('bug').classList.toggle('show', !!(s && s.status==='active'));
  if(!s){ g('fmt').classList.remove('show'); g('win').classList.remove('show'); return; }
  var c = SO.cfgOf(s), so = s.so || {};
  [1,2].forEach(function(n){
    var p = s['player'+n];
    g('n'+n).textContent = SO.splitName(p.name).l || p.name;
    g('st'+n).textContent = p.state || '';
    g('f'+n).textContent = p.frames;
    if(prev['s'+n] !== null && prev['s'+n] !== p.score){ var e = g('s'+n); e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); }
    prev['s'+n] = p.score; g('s'+n).textContent = p.score;
    g('pl'+n).className = 'pl '+(n===1?'l':'r')+(s.turn===n?' at':'');
    var left = (so.ext && so.ext['p'+n]) || 0, ex = '';
    for(var i=0;i<c.extCount;i++) ex += '<span class="'+(i<left?'on':'')+'"></span>';
    g('ex'+n).innerHTML = ex;
  });
  g('bo').textContent = (so.decider?'DECIDER · ':'')+'BEST OF '+s.bestOf;
  g('u-ph').innerHTML = (c.p2On && c.frameSec) ? '<span id="ph1">'+c.shotSec+'s SHOTS</span><span id="ph2" class="p2">'+c.p2Sec+'s FROM '+SO.fmt(c.p2After*1000)+'</span>' : '<span class="on">'+c.shotSec+'s SHOTS</span>';
  var reds = Math.max(0, s.redsRemaining||0);
  g('u-l').innerHTML = '<b>'+reds+'</b> REDS · <b>'+SO.ptsLeft(s)+'</b> ON TABLE';
  // explainer + winner
  g('fmt').classList.toggle('show', s.status==='active' && !!(so.explainer && so.explainer.on));
  if(g('fmt').classList.contains('show') && !g('fmt').dataset.built){ g('fmt').innerHTML = fmtHTML(s, c); g('fmt').dataset.built = '1'; }
  if(!g('fmt').classList.contains('show')) delete g('fmt').dataset.built;
  if(s.status==='finished') showWin(s); else g('win').classList.remove('show');
  // stingers
  if(so.ev && so.ev.ts !== lastEv){ var first = lastEv===null; lastEv = so.ev.ts; if(!first && SO.now()-so.ev.ts < 6000) stinger(so.ev); }
}

var EVSTYLE = { timefoul:'red', frameup:'red', matchup:'red', foul:'red', ext:'amber', phase:'amber', go:'green', frame:'' };
function stinger(e){
  if(!e.txt || e.t==='pause' || e.t==='resume' || e.t==='ready' || e.t==='win' || e.t==='undo') return;
  var el = g('stg'); el.className = EVSTYLE[e.t]||'';
  g('stg-b').textContent = e.txt; g('stg-s').textContent = e.sub||'';
  void el.offsetWidth; el.classList.add('show');
  clearTimeout(stgT); stgT = setTimeout(function(){ el.classList.remove('show'); }, e.t==='go'?2500:4200);
}

function fmtHTML(s, c){
  var mm = function(x){ return x ? SO.fmt(x*1000) : 'NO LIMIT'; };
  var split = (c.p2On && c.frameSec) ? Math.min(100, Math.round(c.p2After/c.frameSec*100)) : 100;
  return '<div class="fx-h"><i>HOW THIS MATCH WORKS</i><b>SHOOT OUT</b><span>'+SO.esc(s.player1.name)+'  v  '+SO.esc(s.player2.name)+' · BEST OF '+s.bestOf+'</span></div>'+
    '<div class="fx-cards">'+
      '<div class="fx-c m"><i>MATCH</i><b>'+mm(c.matchSec)+'</b><small>TOTAL MATCH TIME</small></div>'+
      '<div class="fx-c f"><i>FRAME</i><b>'+mm(c.frameSec)+'</b><small>EVERY FRAME</small></div>'+
      '<div class="fx-c s"><i>SHOT</i><b>'+c.shotSec+'s'+(split<100?' → '+c.p2Sec+'s':'')+'</b><small>EVERY SHOT</small></div>'+
    '</div>'+
    (c.frameSec ? '<div class="fx-tl"><div class="bar"><div class="p1" style="--w:'+split+'%">'+c.shotSec+' SEC SHOTS</div>'+(split<100?'<div class="p2" style="--w:'+(100-split)+'%">'+c.p2Sec+' SEC</div>':'')+'</div>'+
      '<div class="lab"><span>FRAME STARTS</span>'+(split<100?'<span>SHOT CLOCK DROPS AT '+SO.fmt(c.p2After*1000)+'</span>':'')+'<span>'+SO.fmt(c.frameSec*1000)+' · FRAME ENDS</span></div></div>' : '')+
    '<div class="fx-r">'+
      '<div><em>⏱</em><span>Shot clock runs out = <b>TIME FOUL</b> · +'+c.penalty+' to opponent, ball in hand</span></div>'+
      (c.extCount ? '<div><em>＋</em><span><b>'+c.extCount+' EXTENSION'+(c.extCount>1?'S':'')+'</b> per player per frame · +'+c.extSec+'s</span></div>' : '<div><em>＋</em><span>No extensions in this format</span></div>')+
      (c.frameSec ? '<div><em>🏁</em><span>Frame clock hits zero → <b>highest score wins the frame</b></span></div>' : '')+
      (c.matchSec ? '<div><em>⌛</em><span>Match clock hits zero → '+(c.endRule==='finish'?'current frame is the <b>last frame</b>':'<b>play stops</b>')+'. Level = deciding frame</span></div>' : '')+
    '</div>';
}

function showWin(s){
  var w = s.matchWinner, st = (s.so && s.so.stats) || { p1:{}, p2:{} };
  function avg(p){ return p && p.shots ? (p.ms/p.shots/1000).toFixed(1)+'s' : '–'; }
  if(!g('win').classList.contains('show')){
    g('win').innerHTML = '<i>MATCH WINNER</i><b>'+SO.esc(s['player'+w].name)+'</b><div class="fs">'+s.player1.frames+' – '+s.player2.frames+'</div>'+
      '<table><tr><td>'+avg(st.p1)+'</td><td>AVG SHOT TIME</td><td>'+avg(st.p2)+'</td></tr>'+
      '<tr><td>'+(st.p1.tf||0)+'</td><td>TIME FOULS</td><td>'+(st.p2.tf||0)+'</td></tr>'+
      '<tr><td>'+SO.esc(SO.splitName(s.player1.name).l)+'</td><td></td><td>'+SO.esc(SO.splitName(s.player2.name).l)+'</td></tr></table>';
    g('win').classList.add('show');
  }
}

function lvl(rem, warnMs, dangerMs){ return rem <= dangerMs ? 'danger' : rem <= warnMs ? 'warn' : ''; }
function pulseAt(rem, warnMs){
  if(rem <= 0) return .7;
  if(rem > warnMs) return 0;
  var period = rem <= 2000 ? 500 : 1000;
  return Math.pow((rem % period) / period, 2.2);
}

function frame(){
  requestAnimationFrame(frame);
  if(!S || !S.so || S.status!=='active'){ g('edge').style.opacity = 0; return; }
  var t = SO.times(S), c = t.cfg, so = S.so, warn = c.warnAt*1000, live = t.running && so.started;
  // match strip
  var ms = g('ms');
  if(!t.hasMatch) ms.className = 'mstrip off';
  else {
    ms.className = 'mstrip '+(so.matchUp ? 'danger' : lvl(t.mRem, 60000, 30000));
    g('ms-v').textContent = so.matchUp ? (c.endRule==='finish'?'LAST FRAME':'TIME UP') : SO.fmt(t.mRem);
    g('ms-f').style.width = (so.matchUp ? 0 : t.mRem/t.mTot*100)+'%';
  }
  // frame clock in the middle
  var mid = g('mid');
  g('fl').textContent = (so.decider?'DECIDER':'FRAME '+S.currentFrame);
  if(t.hasFrame){
    mid.className = 'mid '+(t.fRem<=0 ? 'danger' : lvl(t.fRem, 60000, 15000));
    g('fv').textContent = t.fRem<=0 ? 'TIME UP' : SO.fmt(t.fRem);
    g('ff').style.width = (t.fRem/t.fTot*100)+'%';
  } else { mid.className = 'mid nof'; g('fv').textContent = S.player1.frames+' – '+S.player2.frames; g('ff').style.width='0'; }
  // shot bars — only the player at the table drains, no numbers on screen
  var frac = live && t.sDur ? t.sRem/t.sDur : 1;
  [1,2].forEach(function(n){
    var bar = g('sb'+n), at = S.turn===n;
    bar.firstChild.style.width = (at ? frac*100 : 100)+'%';
    bar.className = 'sbar '+(at && live ? (t.sRem <= warn ? 'danger' : t.sRem <= Math.max(warn*2,10000) ? 'warn' : '') : '');
    g('bg'+n).style.opacity = (at && live) ? pulseAt(t.sRem, warn)*.75 : 0;
  });
  g('edge').style.opacity = (EDGE && live) ? pulseAt(t.sRem, warn) : 0;
  // status line
  var ur = g('u-r');
  if(!so.started){ ur.textContent = 'STARTING SOON'; ur.className = 'paused'; }
  else if(!t.running){ ur.textContent = t.fEl===0 ? 'FRAME '+S.currentFrame+' · READY' : 'PAUSED'; ur.className = 'paused'; }
  else { ur.innerHTML = S.currentBreak ? 'BREAK <b>'+S.currentBreak+'</b>' : (S.player1.score===S.player2.score ? 'SCORES LEVEL' : SO.esc(SO.splitName(S['player'+(S.player1.score>S.player2.score?1:2)].name).l)+' LEADS BY <b>'+Math.abs(S.player1.score-S.player2.score)+'</b>'); ur.className=''; }
  // phase chips + banner on change
  if(c.p2On && c.frameSec){
    var p1 = g('ph1'), p2 = g('ph2'); if(p1){ p1.className = t.phase===1?'on':''; p2.className = 'p2'+(t.phase===2?' on':''); }
    if(live && lastPhase===1 && t.phase===2) stinger({ t:'phase', txt:'SHOT CLOCK NOW '+c.p2Sec+'s', sub:'Faster shot clock for the rest of the frame' });
    lastPhase = t.phase;
  }
}
requestAnimationFrame(frame);
</script>
